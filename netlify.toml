[build]
  functions = "netlify/functions"

[functions."quote-page"]
  included_files = ["quote.html"]

[functions."customer-page"]
  included_files = ["customer.html", "quote.html"]

[[redirects]]
  from = "/q/*"
  to = "/.netlify/functions/quote-page/:splat"
  status = 200

# Old share links: retired. Shows a "no longer active" page, loads no data.
[[redirects]]
  from = "/s/*"
  to = "/.netlify/functions/share-page/:splat"
  status = 200

# Customer share page. Everything after "#" never reaches the server.
[[redirects]]
  from = "/c/*"
  to = "/.netlify/functions/customer-page/:splat"
  status = 200

[[redirects]]
  from = "/c"
  to = "/.netlify/functions/customer-page"
  status = 200

[[redirects]]
  from = "/r/*"
  to = "/.netlify/functions/redirect"
  status = 200

# Quote media (images / videos copied from vendors by the app) served from our own domain.
# Files live in the Supabase storage bucket "quote-media" under random UUID names.
[[redirects]]
  from = "/media/*"
  to = "https://srlbevzrkovruyerixdi.supabase.co/storage/v1/object/public/quote-media/:splat"
  status = 200
  force = true

# Opaque viewer links: /v/<token> opens the viewer, which looks the token up server-side.
[[redirects]]
  from = "/v/*"
  to = "/index.html"
  status = 200
